services:
  backend:
    image: pi-backend:latest
    container_name: pi-backend
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - pi-network

  prometheus:
    image: prom/prometheus:latest
    container_name: pi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    networks:
      - pi-network

  grafana:
    image: grafana/grafana:latest
    container_name: pi-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    networks:
      - pi-network

networks:
  pi-network:
    driver: bridge

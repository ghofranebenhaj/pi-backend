apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-backend
  labels:
    app: streetleague
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pi-backend
  template:
    metadata:
      labels:
        app: pi-backend
        tier: backend
    spec:
      containers:
      - name: backend
        image: pi-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
---
apiVersion: v1
kind: Service
metadata:
  name: pi-backend-service
spec:
  selector:
    app: pi-backend
  ports:
    - port: 8081
      targetPort: 8081
  type: NodePort
